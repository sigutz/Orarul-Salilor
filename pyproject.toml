[project]
name = "orar"
version = "0.1.0"
description = "Orarul Salilor (FMI) - orar interactiv pe sali si grupe, cu ingest determinist local"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",          # sesiuni semnate (Etapa 7)
    # db
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # ingest
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "rapidfuzz>=3.9",             # corectie lexicon (§3.3)
    "pillow>=10.0",
]

[project.optional-dependencies]
# Instalate doar cand se lucreaza la Etapa 4+ (captura/segmentare/OCR).
# Tinute separat ca `pip install -e .` sa ramana rapid pentru munca la UI.
ingest = [
    "playwright>=1.45",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "pytesseract>=0.3.10",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
orar = "orar.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: `Depends(...)`/`Query(...)` in argumente implicite e chiar idiomul FastAPI.
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# Migrarile sunt generate de Alembic; nu le reformatam manual.
"src/orar/db/migrations/versions/*" = ["UP", "I001"]
