{% extends "base.html" %}
{% block titlu %}Cont nou{% endblock %}

{% block continut %}
<section class="formular">
  <h1>Cont nou</h1>
  <p class="nota">Alege-ți grupa acum și intri direct în orarul tău. Semigrupa și opționalele
    se aleg după, în <a href="/preferinte">preferințe</a>.</p>

  {% if eroare %}<p class="avertisment" role="alert">{{ eroare }}</p>{% endif %}

  <form method="post" action="/inregistrare" class="camp-lista">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>
      <span>Nume</span>
      <input type="text" name="nume" value="{{ nume or '' }}" required autofocus
             autocomplete="name">
    </label>
    <label>
      <span>Email</span>
      <input type="email" name="email" value="{{ email or '' }}" required
             autocomplete="username">
    </label>
    <label>
      <span>Parolă <small>cel puțin 10 caractere</small></span>
      <input type="password" name="parola" required minlength="10"
             autocomplete="new-password">
    </label>
    <label>
      <span>Grupa <small>opțional, o poți alege și mai târziu</small></span>
      <select name="grupa_id">
        <option value="">— alege —</option>
        {% for g in grupe %}
          <option value="{{ g.id }}" {% if grupa_id == g.id|string %}selected{% endif %}>{{ g.nume }}</option>
        {% endfor %}
      </select>
    </label>
    <button type="submit" class="principal">Creează contul</button>
  </form>

  <p class="nota">Ai deja cont? <a href="/intrare">Intră</a>.</p>
</section>
{% endblock %}
